name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    # 固定镜像版本：ubuntu-latest 开始迁移到 Ubuntu 26，会导致构建环境漂移
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip
          ./gradle-8.13/bin/gradle --version
      - name: Build release APK
        run: ./gradle-8.13/bin/gradle :app:assembleRelease --no-daemon
      - name: Rename APK
        # 文件名带 run_number，与 release tag / versionCode 一致，手机上一眼区分新旧版本
        run: mv app/build/outputs/apk/release/*.apk "MC-kai-fu-v1.0-${{ github.run_number }}.apk"
      - name: Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0-${{ github.run_number }}"
          APK="MC-kai-fu-v1.0-${{ github.run_number }}.apk"
          gh release create "$TAG" "$APK" --title "MC开服 v1.0 (build ${{ github.run_number }})" \
            --notes "自构建版 build ${{ github.run_number }}，直接安装。安装后 App 设置里可核对版本号。" \
            || gh release upload "$TAG" "$APK" --clobber
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MC-kai-fu-v1.0-${{ github.run_number }}
          path: MC-kai-fu-v1.0-${{ github.run_number }}.apk
          if-no-files-found: error
