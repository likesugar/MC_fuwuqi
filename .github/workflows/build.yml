name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip
          ./gradle-8.11.1/bin/gradle --version
      - name: Build debug APK
        run: ./gradle-8.11.1/bin/gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "MC-kai-fu-v1.0.apk"
      - name: Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0-${{ github.run_number }}" "MC-kai-fu-v1.0.apk" --title "MC开服 v1.0" --notes "自构建版，直接安装" || gh release upload "v1.0-${{ github.run_number }}" "MC-kai-fu-v1.0.apk" --clobber
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MC-kai-fu-1.0-debug
          path: MC开服_v1.0.apk
